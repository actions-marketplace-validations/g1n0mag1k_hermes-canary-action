name: Hermes PHI Canary
description: >-
  Zero-PHI-egress synthetic PHI canary tests for HIPAA-regulated CI/CD pipelines.
  Verifies all 16 Safe Harbor scrubber categories and writes a tamper-evident signed receipt per run.
branding:
  icon: shield
  color: green

inputs:
  sentry-dsn:
    description: Optional Sentry DSN used to validate remote scrubber behavior.
    required: false
    default: ''
  hermes-api-key:
    description: Optional Hermes Relay API key for signed telemetry upload.
    required: false
    default: ''
  ruleset:
    description: Scrubber ruleset identifier to apply during canary verification.
    required: false
    default: hipaa-safe-harbor-16
  fail-on-leak:
    description: Exit with failure when any PHI leak is detected.
    required: false
    default: 'true'
  output-dir:
    description: Directory where the JSON compliance receipt is written.
    required: false
    default: ./hermes-evidence
  post-comment:
    description: Post a pass/fail summary comment to the pull request. Requires contents:write and pull-requests:write permissions.
    required: false
    default: 'true'
  validate-license:
    description: Validate the hermes-api-key as a Keygen.sh license before running. Set to false to skip validation (not recommended in production).
    required: false
    default: 'true'

outputs:
  status:
    description: Overall canary outcome (PASSED or FAILED).
    value: ${{ steps.hermes-canary.outputs.status }}
  receipt-path:
    description: Local filesystem path to the generated JSON receipt.
    value: ${{ steps.hermes-canary.outputs.receipt-path }}
  comment-url:
    description: URL of the pull request comment posted by Hermes, if any.
    value: ${{ steps.hermes-canary.outputs.comment-url }}
  license-status:
    description: Keygen license validation result (valid, invalid, skipped, or free-tier)
    value: ${{ steps.hermes-canary.outputs.license-status }}

runs:
  using: composite
  steps:
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Run Hermes PHI canary harness
      id: hermes-canary
      shell: bash
      env:
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
        HERMES_API_KEY: ${{ inputs.hermes-api-key }}
        RULESET: ${{ inputs.ruleset }}
        FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
        OUTPUT_DIR: ${{ inputs.output-dir }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        POST_COMMENT: ${{ inputs.post-comment }}
        VALIDATE_LICENSE: ${{ inputs.validate-license }}
      run: python "${{ github.action_path }}/entrypoint.py"
